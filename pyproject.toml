[project]
name = "poly-meridian"
version = "0.1.0"
description = "Polymarket quant trading agent — multi-strategy hybrid, paper-first."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Poly Meridian" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Async I/O
    "anyio>=4.4",
    "httpx>=0.27",
    "websockets>=12.0",
    "tenacity>=8.4",
    # Storage
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "pgvector>=0.3",
    # Numerics
    "numpy>=1.26",
    "pandas>=2.2",
    # Observability
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
polymarket = [
    "py-clob-client>=0.20",
    "web3>=6.20",
]
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.42",
    "torch>=2.3",
]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[project.scripts]
poly-meridian = "poly_meridian.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poly_meridian"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["py_clob_client.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: requires database / network",
    "strategy: synthetic strategy backtests",
]
